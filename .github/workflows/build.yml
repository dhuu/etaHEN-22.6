name: Build etaHEN

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash clang-18 lld-18 wget socat cmake meson pkg-config python3 python3-pyelftools unzip

      - name: Install PS5 Payload SDK
        run: |
          wget https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -d /opt ps5-payload-sdk.zip

      - name: Build etaHEN
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export CC=clang-18
          export CXX=clang++-18
          export LLD=lld-18
          
          cd "Source Code"
          mkdir -p build
          cd build
          
          $PS5_PAYLOAD_SDK/bin/prospero-cmake ..
          
          make -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etaHEN-Build
          path: |
            Source Code/bin/*
            Source Code/build/*.bin
            Source Code/build/*.elf
